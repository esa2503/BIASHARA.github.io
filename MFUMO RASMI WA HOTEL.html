<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mfumo wa Hoteli</title>
<style>
  :root{
    --wood-900:#242424;
    --wood-800:#3a3a3a;
    --wood-700:#525252;
    --spice-700:#9c3b26;
    --spice-600:#b8492f;
    --spice-500:#d1603f;
    --gold-600:#c48a2e;
    --gold-500:#d9a441;
    --gold-100:#f2e9d8;
    --bg:#e6e6e6;
    --card:#ffffff;
    --ink:#242424;
    --muted:#6f6f6f;
    --border:#d7d7d7;
    --danger:#b3261e;
    --danger-bg:#fbeae8;
    --ok:#2f7d4f;
    --ok-bg:#e8f4ec;
    --radius:10px;
    --shadow:0 1px 3px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  /* ---------- LOGIN ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:linear-gradient(160deg,#333333,#5c5c5c 60%,#8a8a8a);}
  .login-card{background:var(--card);width:100%;max-width:360px;border-radius:14px;padding:32px 28px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);}
  .login-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .login-brand .dot{width:12px;height:12px;border-radius:50%;background:var(--gold-500);
    box-shadow:0 0 0 4px var(--gold-100);}
  .login-brand h1{font-size:18px;margin:0;letter-spacing:.2px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .field input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
    font-size:14.5px;background:#fdfdfd;outline:none;transition:border-color .15s;}
  .field input:focus{border-color:var(--spice-600);}
  .login-btn{width:100%;padding:11px;border:none;border-radius:8px;background:var(--spice-700);
    color:#fff;font-size:15px;font-weight:600;margin-top:6px;transition:background .15s;}
  .login-btn:hover{background:var(--wood-800);}
  .hint{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.5;text-align:center;}
  .login-err{background:var(--danger-bg);color:var(--danger);font-size:13px;padding:8px 10px;
    border-radius:8px;margin-bottom:14px;display:none;}

  /* ---------- APP SHELL ---------- */
  .topbar{background:var(--wood-900);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:5;}
  .topbar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .topbar .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;}
  .topbar .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--gold-500);}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab-btn{background:transparent;border:none;color:#dcdcdc;padding:8px 12px;border-radius:7px;
    font-size:13.5px;font-weight:500;white-space:nowrap;transition:background .15s,color .15s;}
  .tab-btn.active{background:rgba(255,255,255,.16);color:#fff;}
  .tab-btn:hover{color:#fff;}
  .logout-btn{background:transparent;border:1px solid rgba(255,255,255,.35);color:#f0f0f0;
    padding:7px 12px;border-radius:7px;font-size:13px;flex-shrink:0;}
  .logout-btn:hover{background:rgba(255,255,255,.12);}

  .fab-sell{position:fixed;right:18px;bottom:22px;z-index:20;background:var(--spice-700);color:#fff;
    border:none;border-radius:30px;padding:13px 20px;font-size:14.5px;font-weight:700;
    box-shadow:0 8px 20px rgba(0,0,0,.35);display:flex;align-items:center;gap:7px;}
  .fab-sell:hover{background:var(--wood-800);}
  .fab-sell .fab-dot{width:8px;height:8px;border-radius:50%;background:var(--gold-500);}

  .container{max-width:980px;margin:0 auto;padding:22px 18px 90px;}
  h2.page-title{font-size:19px;margin:4px 0 16px;color:var(--wood-900);}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px;margin-bottom:20px;}
  .card h3{margin:0 0 14px;font-size:15px;color:var(--wood-800);}

  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:end;}
  .form-grid .field{margin-bottom:0;}
  .form-grid .field label{font-size:12px;}
  .form-grid input,.form-grid select{width:100%;padding:9px 10px;border:1px solid var(--border);
    border-radius:7px;font-size:14px;background:#fdfdfd;}
  .btn-primary{background:var(--spice-700);color:#fff;border:none;padding:10px 16px;border-radius:7px;
    font-size:14px;font-weight:600;}
  .btn-primary:hover{background:var(--wood-800);}
  .btn-primary:disabled{background:#c2c2c2;cursor:not-allowed;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:none;
    padding:8px 10px;border-bottom:2px solid var(--gold-600);background:var(--gold-100);}
  td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:nth-child(odd){background:#ffffff;color:var(--ink);}
  tbody tr:nth-child(even){background:#f4f4f4;color:var(--wood-800);}
  tbody tr:hover{background:var(--gold-100);}
  tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}
  .table-select{font-size:12.5px;padding:5px 6px;border:1px solid var(--border);border-radius:6px;
    background:#fdfdfd;color:inherit;max-width:220px;}

  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .mini-btn{font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid var(--border);
    background:#fff;color:var(--wood-800);}
  .mini-btn:hover{background:var(--gold-100);}
  .mini-btn.danger{color:var(--danger);border-color:#f3cfcb;}
  .mini-btn.danger:hover{background:var(--danger-bg);}

  .summary-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .summary-box{flex:1;min-width:160px;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
  .summary-box .label{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .summary-box .value{font-size:20px;font-weight:700;color:var(--wood-900);}

  .empty{color:var(--muted);font-size:13.5px;padding:14px 4px;}
  .loading{color:var(--muted);font-size:13.5px;padding:20px;text-align:center;}

  .note-box{background:#f2ede1;border:1px solid var(--gold-500);color:#6b4f14;font-size:12.5px;
    padding:10px 12px;border-radius:8px;line-height:1.55;}
  .role-badge{display:inline-block;font-size:11.5px;padding:3px 10px;border-radius:20px;
    background:rgba(255,255,255,.16);color:#fff;margin-left:10px;font-weight:600;}
  .login-modes{display:flex;gap:0;margin-bottom:20px;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .login-mode-btn{flex:1;padding:9px;border:none;background:#fff;color:var(--muted);font-size:13px;font-weight:600;}
  .login-mode-btn.active{background:var(--spice-700);color:#fff;}
  .shift-open{color:var(--ok);font-weight:600;}
  .shift-closed{color:var(--muted);}
  .info-display{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;}
  .info-display .info-item .label{font-size:12px;color:var(--muted);margin-bottom:3px;}
  .info-display .info-item .value{font-size:15px;font-weight:600;color:var(--wood-900);}
  .readonly-note{background:var(--gold-100);color:var(--wood-800);font-size:12.5px;padding:10px 12px;
    border-radius:8px;line-height:1.5;}

  .category-badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:12px;font-weight:600;}
  .category-badge.chakula{background:#fbe4d3;color:var(--spice-700);}
  .category-badge.kinywaji{background:var(--ok-bg);color:var(--ok);}
  .stock-low{color:var(--danger);font-weight:700;}
  .stock-ok{color:var(--ok);font-weight:600;}
  .subtabs{display:flex;gap:8px;margin-bottom:14px;}
  .subtab-btn{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;
    font-size:13px;font-weight:600;color:var(--muted);}
  .subtab-btn.active{background:var(--spice-700);color:#fff;border-color:var(--spice-700);}

  .cart-line{display:flex;justify-content:space-between;align-items:center;padding:9px 0;
    border-bottom:1px dashed var(--border);gap:10px;}
  .cart-line .ci-name{font-weight:600;color:var(--wood-900);}
  .cart-line .ci-sub{font-size:12px;color:var(--muted);}
  .cart-total{font-size:19px;font-weight:700;color:var(--wood-900);text-align:right;margin-top:12px;
    padding-top:12px;border-top:2px solid var(--gold-600);}
  .login-photo{display:block;width:calc(100% + 56px);margin:-32px -28px 20px -28px;
    max-height:360px;object-fit:cover;border-radius:14px 14px 0 0;}
  .dev-credit{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);
    text-align:center;font-size:12px;color:var(--muted);line-height:1.7;}
  .dev-credit b{color:var(--wood-800);}
</style>
</head>
<body>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const OWNER_USERNAME = "mmiliki";
const OWNER_PASSWORD = "hoteli2026";
const LOW_STOCK_THRESHOLD = 5;
const UNITS = ["kilo","lita","idadi","pakiti","nyingine"];
const UNIT_LABELS = { kilo:"Kilo", lita:"Lita", idadi:"Idadi", pakiti:"Pakiti", nyingine:"Nyingine" };

const DEFAULT_RAW_STOCK = [
  { id:"raw-ngano", name:"Ngano", unit:"kilo", stock:0 },
  { id:"raw-unga", name:"Unga", unit:"kilo", stock:0 },
  { id:"raw-sukari", name:"Sukari", unit:"kilo", stock:0 },
  { id:"raw-mafuta", name:"Mafuta ya Kupikia", unit:"lita", stock:0 },
  { id:"raw-chumvi", name:"Chumvi", unit:"kilo", stock:0 },
  { id:"raw-vitunguu", name:"Vitunguu", unit:"kilo", stock:0 },
];

function genId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function fmt(n){
  return Number(n||0).toLocaleString("sw-TZ", {maximumFractionDigits:2});
}
function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function nowDisplay(){
  const d = new Date();
  return d.toLocaleString("sw-TZ", {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
function nowDisplayFromTs(ts){
  if(!ts) return "-";
  return new Date(ts).toLocaleString("sw-TZ", {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}
function inPeriod(dateStr, period){
  if(period === "yote") return true;
  if(!dateStr) return false;
  const d = new Date(dateStr+"T00:00:00");
  const now = new Date();
  const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if(period === "leo") return d.getTime() === today0.getTime();
  if(period === "wiki"){
    const weekAgo = new Date(today0); weekAgo.setDate(weekAgo.getDate()-6);
    return d.getTime() >= weekAgo.getTime() && d.getTime() <= today0.getTime();
  }
  if(period === "mwezi") return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  return true;
}
function categoryLabel(cat){ return cat === "chakula" ? "Chakula" : "Kinywaji"; }
function unitLabel(u){ return UNIT_LABELS[u] || u; }
function mondayOf(d){
  const day = d.getDay();
  const diff = (day===0 ? -6 : 1-day);
  const m = new Date(d);
  m.setDate(d.getDate()+diff);
  m.setHours(0,0,0,0);
  return m;
}
function getCurrentWeekRange(){
  const now = new Date();
  const mon = mondayOf(now);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return { start: mon.toISOString().slice(0,10), end: sun.toISOString().slice(0,10) };
}
function isDateInClosedWeek(dateStr, weeklyClosings){
  if(!dateStr) return false;
  return (weeklyClosings||[]).some(w => dateStr >= w.start && dateStr <= w.end);
}
function pushToTrash(setTrash, trash, type, label, data, deletedBy){
  const entry = { id: genId(), type, label, data, deletedBy, deletedAt: nowDisplay() };
  setTrash([entry, ...(trash||[])]);
}

/* ---------- LOGIN ---------- */
function LoginScreen({ onOwnerLogin, onSellerLogin, sellers }){
  const activeSellers = (sellers||[]).filter(s => s.active !== false);
  const [mode, setMode] = useState(activeSellers.length ? "muuzaji" : "mmiliki");
  const [u,setU] = useState("");
  const [p,setP] = useState("");
  const [sellerId, setSellerId] = useState("");
  const [pass, setPass] = useState("");
  const [err,setErr] = useState("");

  function submitOwner(e){
    e.preventDefault();
    if(u.trim() === OWNER_USERNAME && p === OWNER_PASSWORD){
      setErr("");
      onOwnerLogin();
    } else {
      setErr("Jina la mtumiaji au nywila si sahihi.");
    }
  }

  function submitSeller(e){
    e.preventDefault();
    const s = activeSellers.find(x=>x.id===sellerId);
    if(!s){ setErr("Chagua jina lako kwenye orodha."); return; }
    if(String(pass) !== String(s.password)){ setErr("Password si sahihi."); return; }
    setErr("");
    onSellerLogin(s);
  }

const ROLE_OPTIONS = [
  { key:"muuzaji", label:"Muuzaji" },
  { key:"muhasibu", label:"Muhasibu" },
  { key:"store", label:"Store" },
  { key:"msambazaji", label:"Msambazaji wa Oda" },
  { key:"mpishi", label:"Mpishi" },
  { key:"hr", label:"HR (Rasilimali Watu)" },
];
function roleLabel(key){
  const r = ROLE_OPTIONS.find(x=>x.key===key);
  return r ? r.label : key;
}
function sellerRoles(sellerName, sellers){
  const s = (sellers||[]).find(x=>x.name===sellerName);
  return (s && s.roles) || [];
}

const ARRAY_KEYS = ["menuItems","rawStock","rawPurchases","rawUsageLogs","sales","expenses","sellers","shifts",
  "customerOrders","distributors","dutyLogs","attendanceLogs","weeklyClosings","trash","emergencyContacts"];
const OBJECT_KEYS = ["businessInfo"];

const STORAGE_PREFIX = "mfumoHoteli_v2_";
const localDB = {
  get(key){
    try{ return window.localStorage.getItem(STORAGE_PREFIX+key); }
    catch(e){ return null; }
  },
  set(key, value){
    try{ window.localStorage.setItem(STORAGE_PREFIX+key, value); return true; }
    catch(e){ return false; }
  }
};

function App(){
  const [session, setSession] = useState(null); // {role:"mmiliki"|"muuzaji", sellerName, shiftId, loginTime}
  const [tab, setTab] = useState("taarifa");
  const [menuItems, setMenuItemsState] = useState(null);
  const [rawStock, setRawStockState] = useState(null);
  const [rawPurchases, setRawPurchasesState] = useState(null);
  const [rawUsageLogs, setRawUsageLogsState] = useState(null);
  const [sales, setSalesState] = useState(null);
  const [expenses, setExpensesState] = useState(null);
  const [sellers, setSellersState] = useState(null);
  const [shifts, setShiftsState] = useState(null);
  const [businessInfo, setBusinessInfoState] = useState(null);
  const [customerOrders, setCustomerOrdersState] = useState(null);
  const [distributors, setDistributorsState] = useState(null);
  const [dutyLogs, setDutyLogsState] = useState(null);
  const [attendanceLogs, setAttendanceLogsState] = useState(null);
  const [weeklyClosings, setWeeklyClosingsState] = useState(null);
  const [trash, setTrashState] = useState(null);
  const [emergencyContacts, setEmergencyContactsState] = useState(null);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    function grabArr(key){
      try{ const raw = localDB.get(key); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
    }
    function grabObj(key){
      try{ const raw = localDB.get(key); return raw ? JSON.parse(raw) : {}; }catch(e){ return {}; }
    }
    try{
      const mi = grabArr("menuItems") || [];
      let rs = grabArr("rawStock");
      if(rs === null){ rs = DEFAULT_RAW_STOCK.map(x=>({...x})); localDB.set("rawStock", JSON.stringify(rs)); }
      const rp = grabArr("rawPurchases") || [];
      const ru = grabArr("rawUsageLogs") || [];
      const s = grabArr("sales") || [];
      const ex = grabArr("expenses") || [];
      const sel = grabArr("sellers") || [];
      const sh = grabArr("shifts") || [];
      const bi = grabObj("businessInfo");
      const co = grabArr("customerOrders") || [];
      const dist = grabArr("distributors") || [];
      const dl = grabArr("dutyLogs") || [];
      const al = grabArr("attendanceLogs") || [];
      const wc = grabArr("weeklyClosings") || [];
      const tr = grabArr("trash") || [];
      const ec = grabArr("emergencyContacts") || [];
      setMenuItemsState(mi); setRawStockState(rs); setRawPurchasesState(rp); setRawUsageLogsState(ru);
      setSalesState(s); setExpensesState(ex); setSellersState(sel); setShiftsState(sh); setBusinessInfoState(bi);
      setCustomerOrdersState(co);
      setDistributorsState(dist); setDutyLogsState(dl); setAttendanceLogsState(al); setWeeklyClosingsState(wc);
      setTrashState(tr);
      setEmergencyContactsState(ec);
    } finally {
      setReady(true);
    }
  }, []);

  function makeSaver(key, setter){
    return async function(next){
      setter(next);
      const ok = localDB.set(key, JSON.stringify(next));
      if(!ok){
        window.alert("Onyo: hifadhi ya kifaa imejaa au haipatikani (mfano: unatumia 'private/incognito browsing'). Taarifa ya mwisho huenda isihifadhiwe kabisa. Tumia kivinjari cha kawaida na hakikisha nafasi ya kutosha kwenye kifaa.");
      }
    };
  }
  const setMenuItems = makeSaver("menuItems", setMenuItemsState);
  const setRawStock = makeSaver("rawStock", setRawStockState);
  const setRawPurchases = makeSaver("rawPurchases", setRawPurchasesState);
  const setRawUsageLogs = makeSaver("rawUsageLogs", setRawUsageLogsState);
  const setSales = makeSaver("sales", setSalesState);
  const setExpenses = makeSaver("expenses", setExpensesState);
  const setSellers = makeSaver("sellers", setSellersState);
  const setShifts = makeSaver("shifts", setShiftsState);
  const setBusinessInfo = makeSaver("businessInfo", setBusinessInfoState);
  const setCustomerOrders = makeSaver("customerOrders", setCustomerOrdersState);
  const setDistributors = makeSaver("distributors", setDistributorsState);
  const setDutyLogs = makeSaver("dutyLogs", setDutyLogsState);
  const setAttendanceLogs = makeSaver("attendanceLogs", setAttendanceLogsState);
  const setWeeklyClosings = makeSaver("weeklyClosings", setWeeklyClosingsState);
  const setTrash = makeSaver("trash", setTrashState);
  const setEmergencyContacts = makeSaver("emergencyContacts", setEmergencyContactsState);

  function ownerLogin(){
    setSession({ role:"mmiliki", sellerName:"Mmiliki" });
    setTab("taarifa");
  }

  function sellerLogin(seller){
    const shift = { id: genId(), sellerId: seller.id, sellerName: seller.name,
      loginTime: Date.now(), loginDisplay: nowDisplay(), logoutTime:null, logoutDisplay:"",
      status:"wazi", totalSales:0, totalCash:0, totalMkopo:0, ordersCount:0 };
    setShifts([shift, ...(shifts||[])]);
    setSession({ role:"muuzaji", sellerName: seller.name, shiftId: shift.id, loginTime: shift.loginTime });
    setTab("taarifa");
  }

  function logout(){
    if(session && session.role === "muuzaji" && session.shiftId){
      const shiftSales = (sales||[]).filter(s => s.sellerName === session.sellerName && (s.ts||0) >= session.loginTime);
      const totalCash = shiftSales.filter(s=>s.paymentType==="taslimu").reduce((a,b)=>a+b.total,0);
      const totalMkopo = shiftSales.filter(s=>s.paymentType==="mkopo").reduce((a,b)=>a+b.total,0);
      setShifts((shifts||[]).map(sh => sh.id===session.shiftId ? {
        ...sh, logoutTime: Date.now(), logoutDisplay: nowDisplay(), status:"imefungwa",
        totalSales: totalCash+totalMkopo, totalCash, totalMkopo, ordersCount: shiftSales.length,
      } : sh));
    }
    setSession(null);
  }

  function wipeAllData(){
    const allKeys = [...ARRAY_KEYS, ...OBJECT_KEYS];
    allKeys.forEach(k => {
      try{ window.localStorage.removeItem(STORAGE_PREFIX+k); }catch(e){}
    });
    window.location.reload();
  }

  if(!session){
    return <LoginScreen onOwnerLogin={ownerLogin} onSellerLogin={sellerLogin} sellers={sellers||[]} />;
  }

  if(!ready){
    return <div className="loading">Inapakia data...</div>;
  }

  const myRoles = session.role==="muuzaji" ? sellerRoles(session.sellerName, sellers) : [];
  const isMuhasibu = session.role==="mmiliki" || myRoles.includes("muhasibu");
  const isHR = session.role==="mmiliki" || myRoles.includes("hr");

  const allTabs = [
    { key:"taarifa", label:"Taarifa" },
    { key:"menu", label:"Menu" },
    { key:"stock", label:"Stock ya Malighafi" },
    { key:"mauzo", label:"Mauzo" },
    { key:"gharama", label:"Gharama" },
    { key:"wateja", label:"Wateja" },
    { key:"wafanyakazi", label:"Wafanyakazi", ownerOnly:true, extraAllowed: isHR },
    { key:"ukaguzi", label:"Ukaguzi wa Mahesabu", ownerOnly:true, extraAllowed: isMuhasibu },
    { key:"mfumo", label:"Mfumo", ownerOnly:true },
  ];
  const tabsConfig = allTabs.filter(t => !t.ownerOnly || session.role==="mmiliki" || t.extraAllowed);

  return (
    <div>
      <div className="topbar">
        <div className="topbar-top">
          <div className="brand"><span className="dot"></span> Mfumo wa Hoteli
            <span className="role-badge">{session.role==="mmiliki" ? "Mmiliki" : "Muuzaji: "+session.sellerName+(myRoles.length ? " ("+myRoles.map(roleLabel).join(", ")+")" : "")}</span>
          </div>
          <button className="logout-btn" onClick={logout}>{session.role==="mmiliki" ? "Toka" : "Maliza Zamu"}</button>
        </div>
        <div className="tabs">
          {tabsConfig.map(t => (
            <button key={t.key} className={"tab-btn "+(tab===t.key?"active":"")} onClick={()=>setTab(t.key)}>{t.label}</button>
          ))}
        </div>
      </div>
      <div className="container">
        {tab === "taarifa" &&
          <TaarifaPage businessInfo={businessInfo} setBusinessInfo={setBusinessInfo} session={session}
            sales={sales} expenses={expenses} shifts={shifts}
            emergencyContacts={emergencyContacts} setEmergencyContacts={setEmergencyContacts} />}
        {tab === "menu" &&
          <MenuPage menuItems={menuItems} setMenuItems={setMenuItems} role={session.role} session={session}
            trash={trash} setTrash={setTrash} />}
        {tab === "stock" &&
          <StockPage rawStock={rawStock} setRawStock={setRawStock}
            rawPurchases={rawPurchases} setRawPurchases={setRawPurchases}
            rawUsageLogs={rawUsageLogs} setRawUsageLogs={setRawUsageLogs}
            expenses={expenses} setExpenses={setExpenses}
            weeklyClosings={weeklyClosings}
            role={session.role} session={session} />}
        {tab === "mauzo" &&
          <SalesPage menuItems={menuItems} sales={sales} setSales={setSales}
            weeklyClosings={weeklyClosings}
            session={session} sellers={sellers} />}
        {tab === "gharama" &&
          <GharamaPage expenses={expenses} setExpenses={setExpenses} session={session} shifts={shifts} sellers={sellers}
            weeklyClosings={weeklyClosings} trash={trash} setTrash={setTrash} />}
        {tab === "wateja" &&
          <WatejaPage customerOrders={customerOrders} setCustomerOrders={setCustomerOrders}
            distributors={distributors} setDistributors={setDistributors}
            dutyLogs={dutyLogs} setDutyLogs={setDutyLogs}
            sellers={sellers} session={session} trash={trash} setTrash={setTrash}
            businessInfo={businessInfo} />}
        {tab === "wafanyakazi" && isHR &&
          <WafanyakaziPage sellers={sellers} setSellers={setSellers} shifts={shifts}
            attendanceLogs={attendanceLogs} setAttendanceLogs={setAttendanceLogs} session={session}
            trash={trash} setTrash={setTrash} />}
        {tab === "ukaguzi" && isMuhasibu &&
          <UkaguziPage sales={sales} expenses={expenses} rawStock={rawStock} businessInfo={businessInfo}
            weeklyClosings={weeklyClosings} setWeeklyClosings={setWeeklyClosings} session={session} />}
        {tab === "mfumo" && session.role==="mmiliki" &&
          <MfumoPage trash={trash} setTrash={setTrash} wipeAllData={wipeAllData}
            restoreMap={{
              gharama: { list: expenses, setList: setExpenses },
              customerOrder: { list: customerOrders, setList: setCustomerOrders },
              distributor: { list: distributors, setList: setDistributors },
              dutyLog: { list: dutyLogs, setList: setDutyLogs },
              seller: { list: sellers, setList: setSellers },
              menuItem: { list: menuItems, setList: setMenuItems },
              rawStockItem: { list: rawStock, setList: setRawStock },
            }} />}
      </div>
      {tab !== "mauzo" && (
        <button className="fab-sell" onClick={()=>setTab("mauzo")}>
          <span className="fab-dot"></span> Uza
        </button>
      )}
    </div>
  );
}

/* ---------- TAARIFA (Dashboard + Business Info) ---------- */
function TaarifaPage({ businessInfo, setBusinessInfo, session, sales, expenses, shifts, emergencyContacts, setEmergencyContacts }){
  const bi = businessInfo || {};
  const isOwner = session.role === "mmiliki";
  const [editing, setEditing] = useState(false);
  const [hotelName, setHotelName] = useState(bi.hotelName || "");
  const [ownerName, setOwnerName] = useState(bi.ownerName || "");
  const [ownerPhone, setOwnerPhone] = useState(bi.ownerPhone || "");
  const [mkoa, setMkoa] = useState(bi.mkoa || "");
  const [wilaya, setWilaya] = useState(bi.wilaya || "");
  const [mtaa, setMtaa] = useState(bi.mtaa || "");
  const [auditPassword, setAuditPassword] = useState(bi.auditPassword || "");

  // Bodaboda wa Dharura
  const [bodaName, setBodaName] = useState("");
  const [bodaPhone, setBodaPhone] = useState("");
  const [bodaNote, setBodaNote] = useState("");

  function addBoda(e){
    e.preventDefault();
    if(!bodaName.trim() || !bodaPhone.trim()) return;
    const rec = { id: genId(), name: bodaName.trim(), phone: bodaPhone.trim(), note: bodaNote.trim(),
      addedBy: session.sellerName };
    setEmergencyContacts([rec, ...(emergencyContacts||[])]);
    setBodaName(""); setBodaPhone(""); setBodaNote("");
  }

  function removeBoda(id){
    if(!window.confirm("Una uhakika unataka kufuta boda hii ya dharura?")) return;
    setEmergencyContacts((emergencyContacts||[]).filter(b=>b.id!==id));
  }

  function startEdit(){
    setHotelName(bi.hotelName || ""); setOwnerName(bi.ownerName || ""); setOwnerPhone(bi.ownerPhone || "");
    setMkoa(bi.mkoa || ""); setWilaya(bi.wilaya || ""); setMtaa(bi.mtaa || "");
    setAuditPassword(bi.auditPassword || "");
    setEditing(true);
  }
  function saveInfo(e){
    e.preventDefault();
    setBusinessInfo({ ...bi, hotelName: hotelName.trim(), ownerName: ownerName.trim(),
      ownerPhone: ownerPhone.trim(), mkoa: mkoa.trim(), wilaya: wilaya.trim(), mtaa: mtaa.trim(),
      auditPassword: auditPassword.trim() });
    setEditing(false);
  }

  const today = todayStr();
  const todaySales = (sales||[]).filter(s=>s.date===today);
  const todaySalesTotal = todaySales.reduce((a,b)=>a+b.total,0);
  const todayExpensesTotal = (expenses||[]).filter(e=>e.date===today).reduce((a,b)=>a+b.amount,0);
  const openShifts = (shifts||[]).filter(sh=>sh.status==="wazi");

  const mySales = session.role==="muuzaji"
    ? (sales||[]).filter(s=>s.shiftId===session.shiftId)
    : [];
  const mySalesTotal = mySales.reduce((a,b)=>a+b.total,0);

  return (
    <div>
      <h2 className="page-title">{bi.hotelName || "Taarifa ya Hoteli"}</h2>

      {isOwner ? (
        <div className="summary-row">
          <div className="summary-box">
            <div className="label">Mauzo ya Leo (Hoteli Nzima)</div>
            <div className="value">{fmt(todaySalesTotal)}</div>
          </div>
          <div className="summary-box">
            <div className="label">Idadi ya Oda Leo</div>
            <div className="value">{todaySales.length}</div>
          </div>
          <div className="summary-box">
            <div className="label">Gharama za Leo</div>
            <div className="value">{fmt(todayExpensesTotal)}</div>
          </div>
          <div className="summary-box">
            <div className="label">Wafanyakazi Kwenye Zamu Sasa</div>
            <div className="value">{openShifts.length}</div>
          </div>
        </div>
      ) : (
        <div className="summary-row">
          <div className="summary-box">
            <div className="label">Mauzo ya Zamu Yako</div>
            <div className="value">{fmt(mySalesTotal)}</div>
          </div>
          <div className="summary-box">
            <div className="label">Oda Ulizouza Zamu Hii</div>
            <div className="value">{mySales.length}</div>
          </div>
        </div>
      )}

      <div className="card">
        <h3>Taarifa za Hoteli</h3>
        {!isOwner && (
          <div className="readonly-note" style={{marginBottom:14}}>
            Taarifa hii inabadilishwa na Mmiliki pekee.
          </div>
        )}
        {editing ? (
          <form onSubmit={saveInfo}>
            <div className="form-grid" style={{marginBottom:14}}>
              <div className="field">
                <label>Jina la Hoteli</label>
                <input value={hotelName} onChange={e=>setHotelName(e.target.value)} placeholder="mf. Hoteli ya Baraka" />
              </div>
              <div className="field">
                <label>Jina la Mmiliki</label>
                <input value={ownerName} onChange={e=>setOwnerName(e.target.value)} />
              </div>
              <div className="field">
                <label>Namba ya Simu ya Mmiliki</label>
                <input value={ownerPhone} onChange={e=>setOwnerPhone(e.target.value)} placeholder="mf. 07XXXXXXXX" />
              </div>
              <div className="field">
                <label>Mkoa</label>
                <input value={mkoa} onChange={e=>setMkoa(e.target.value)} placeholder="mf. Dar es Salaam" />
              </div>
              <div className="field">
                <label>Wilaya</label>
                <input value={wilaya} onChange={e=>setWilaya(e.target.value)} placeholder="mf. Ilala" />
              </div>
              <div className="field">
                <label>Mtaa</label>
                <input value={mtaa} onChange={e=>setMtaa(e.target.value)} placeholder="mf. Kariakoo" />
              </div>
              <div className="field">
                <label>Password ya Ukaguzi wa Mahesabu</label>
                <input value={auditPassword} onChange={e=>setAuditPassword(e.target.value)} placeholder="Default: ukaguzi2026" />
              </div>
            </div>
            <div className="row-actions">
              <button className="btn-primary" type="submit">Hifadhi</button>
              <button className="mini-btn" type="button" onClick={()=>setEditing(false)}>Ghairi</button>

          <React.Fragment>
            <div className="info-display">
              <div className="info-item"><div className="label">Jina la Hoteli</div><div className="value">{bi.hotelName || "-"}</div></div>
              <div className="info-item"><div className="label">Jina la Mmiliki</div><div className="value">{bi.ownerName || "-"}</div></div>
              <div className="info-item"><div className="label">Namba ya Simu ya Mmiliki</div><div className="value">{bi.ownerPhone || "-"}</div></div>
              <div className="info-item"><div className="label">Mkoa</div><div className="value">{bi.mkoa || "-"}</div></div>
              <div className="info-item"><div className="label">Wilaya</div><div className="value">{bi.wilaya || "-"}</div></div>
              <div className="info-item"><div className="label">Mtaa</div><div className="value">{bi.mtaa || "-"}</div></div>
            </div>
            {isOwner && <button className="mini-btn" style={{marginTop:14}} onClick={startEdit}>Hariri Taarifa</button>}
          </React.Fragment>
        )}
      </div>

      <div className="card" style={{borderColor:"var(--spice-600)"}}>
        <h3>Bodaboda wa Dharura</h3>
        <div className="note-box" style={{marginBottom:14}}>
          Weka hapa mawasiliano ya bodaboda wa dharura wa kutumia endapo kuna haja ya kupeleka au kuletewa kitu hotelini haraka.
        </div>
        <form className="form-grid" onSubmit={addBoda} style={{marginBottom:16}}>
          <div className="field">
            <label>Jina la Bodaboda</label>
            <input value={bodaName} onChange={e=>setBodaName(e.target.value)} placeholder="mf. Boda Rashidi" />
          </div>
          <div className="field">
            <label>Namba ya Simu</label>
            <input value={bodaPhone} onChange={e=>setBodaPhone(e.target.value)} placeholder="mf. 07XXXXXXXX" />
          </div>
          <div className="field">
            <label>Maelezo (hiari)</label>
            <input value={bodaNote} onChange={e=>setBodaNote(e.target.value)} placeholder="mf. Yupo karibu, eneo la..." />
          </div>
          <div className="field">
            <button className="btn-primary" type="submit">Ongeza Bodaboda</button>
          </div>
        </form>
        {(!emergencyContacts || emergencyContacts.length===0) ? (
          <div className="empty">Bado hakuna bodaboda wa dharura aliyeongezwa.</div>
        ) : (
          <div className="table-wrap">
            <table>
              <thead><tr><th>Jina</th><th>Simu</th><th>Maelezo</th><th>Vitendo</th></tr></thead>
              <tbody>
                {emergencyContacts.map(b => (
                  <tr key={b.id}>
                    <td>{b.name}</td><td>{b.phone}</td><td>{b.note || "-"}</td>
                    <td>
                      <div className="row-actions">
                        <a className="mini-btn" href={"tel:"+b.phone}>Piga Simu</a>
                        <a className="mini-btn" href={"sms:"+b.phone}>SMS</a>
                        <button className="mini-btn danger" onClick={()=>removeBoda(b.id)}>Futa</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- MENU (Chakula & Vinywaji vinavyouzwa) ---------- */
function MenuPage({ menuItems, setMenuItems, role, session, trash, setTrash }){
  const isOwner = role === "mmiliki";
  const [name, setName] = useState("");
  const [category, setCategory] = useState("chakula");
  const [price, setPrice] = useState("");
  const [subTab, setSubTab] = useState("chakula");

  function addItem(e){
    e.preventDefault();
    if(!name.trim() || !price) return;
    const rec = { id: genId(), name: name.trim(), category, price: Number(price) };
    setMenuItems([rec, ...(menuItems||[])]);
    setName(""); setPrice("");
  }

  function editItem(id){
    const it = menuItems.find(x=>x.id===id);
    const newName = window.prompt("Jina la kipengele:", it.name);
    if(newName === null) return;
    const newPrice = window.prompt("Bei mpya ya kuuza:", it.price);
    if(newPrice === null) return;
    setMenuItems(menuItems.map(x => x.id===id ? {...x, name:newName.trim()||x.name, price:Number(newPrice)||x.price} : x));
  }

  function removeItem(id){
    if(!window.confirm("Una uhakika unataka kufuta kipengele hiki kwenye menu? Kitahifadhiwa kwenye Pipa la Taka.")) return;
    const rec = menuItems.find(x=>x.id===id);
    if(rec) pushToTrash(setTrash, trash, "menuItem", rec.name+" - TSh "+fmt(rec.price), rec, session.sellerName);
    setMenuItems(menuItems.filter(x=>x.id!==id));
  }

  const items = menuItems || [];
  const filtered = items.filter(it => it.category === subTab);

  return (
    <div>
      <h2 className="page-title">Menu</h2>
      <div className="readonly-note" style={{marginBottom:16}}>
        Haya ndiyo vitu ambavyo muuzaji anauza moja kwa moja kwa mteja, na bei zake.
      </div>

      {isOwner && (
        <div className="card">
          <h3>Ongeza Kipengele cha Menu</h3>
          <form className="form-grid" onSubmit={addItem}>
            <div className="field">
              <label>Jina</label>
              <input value={name} onChange={e=>setName(e.target.value)} placeholder="mf. Wali Nyama, Ugali Sato, Soda..." />
            </div>
            <div className="field">
              <label>Aina</label>
              <select value={category} onChange={e=>setCategory(e.target.value)}>
                <option value="chakula">Chakula</option>
                <option value="kinywaji">Kinywaji</option>
              </select>
            </div>
            <div className="field">
              <label>Bei ya Kuuza</label>
              <input type="number" value={price} onChange={e=>setPrice(e.target.value)} placeholder="0" />
            </div>
            <div className="field">
              <button className="btn-primary" type="submit">Ongeza</button>
            </div>
          </form>
        </div>
      )}

      <div className="card">
        <div className="subtabs">
          <button className={"subtab-btn "+(subTab==="chakula"?"active":"")} onClick={()=>setSubTab("chakula")}>Chakula</button>
          <button className={"subtab-btn "+(subTab==="kinywaji"?"active":"")} onClick={()=>setSubTab("kinywaji")}>Vinywaji</button>
        </div>
        {filtered.length === 0 ? (
          <div className="empty">Bado hakuna kipengele cha {categoryLabel(subTab)} kwenye menu.</div>
        ) : (
          <div className="table-wrap">
            <table>
              <thead>
                <tr><th>Jina</th><th>Bei ya Kuuza</th>{isOwner && <th>Vitendo</th>}</tr>
              </thead>
              <tbody>
                {filtered.map(it => (
                  <tr key={it.id}>
                    <td>{it.name} <span className={"category-badge "+it.category}>{categoryLabel(it.category)}</span></td>
                    <td>{fmt(it.price)}</td>
                    {isOwner && (
                      <td>
                        <div className="row-actions">
                          <button className="mini-btn" onClick={()=>editItem(it.id)}>Hariri</button>
                          <button className="mini-btn danger" onClick={()=>removeItem(it.id)}>Futa</button>
                        </div>
                      </td>
                    )}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- STOCK YA MALIGHAFI (raw ingredients bought, not sold) ---------- */
function StockPage({ rawStock, setRawStock, rawPurchases, setRawPurchases, rawUsageLogs, setRawUsageLogs,
  expenses, setExpenses, weeklyClosings, role, session }){
  const isOwner = role === "mmiliki";
  const items = rawStock || [];

  // Ongeza malighafi mpya (owner only)
  const [newName, setNewName] = useState("");
  const [newUnit, setNewUnit] = useState("kilo");
  const [newUnitCustom, setNewUnitCustom] = useState("");

  function addRawItem(e){
    e.preventDefault();
    if(!newName.trim()) return;
    const unit = newUnit === "nyingine" ? (newUnitCustom.trim() || "nyingine") : newUnit;
    setRawStock([{ id: genId(), name: newName.trim(), unit, stock: 0 }, ...items]);
    setNewName(""); setNewUnit("kilo"); setNewUnitCustom("");
  }

  // Nunua malighafi (manunuzi)
  const [buyItemId, setBuyItemId] = useState("");
  const [buyQty, setBuyQty] = useState("");
  const [buyCost, setBuyCost] = useState("");
  const [buyDate, setBuyDate] = useState(todayStr());
  const [buyErr, setBuyErr] = useState("");

  function submitPurchase(e){
    e.preventDefault();
    setBuyErr("");
    if(!buyItemId || !buyQty || !buyCost) return;
    if(isDateInClosedWeek(buyDate, weeklyClosings)){
      setBuyErr("Muhasibu ameshafunga stock ya wiki inayohusisha tarehe hii.");
      return;
    }
    const it = items.find(x=>x.id===buyItemId);
    if(!it) return;
    setRawStock(items.map(x => x.id===buyItemId ? {...x, stock:(x.stock||0)+Number(buyQty)} : x));
    const purchaser = session.role==="muuzaji" ? session.sellerName : "Mmiliki";
    const purchase = { id: genId(), itemId: buyItemId, itemName: it.name, qty: Number(buyQty), unit: it.unit,
      cost: Number(buyCost), date: buyDate, buyer: purchaser };
    setRawPurchases([purchase, ...(rawPurchases||[])]);
    // Ingiza kama gharama pia, ili ionekane kwenye Gharama za Uendeshaji na Ukaguzi
    const expenseRec = { id: genId(), date: buyDate,
      description: "Ununuzi wa "+it.name+" ("+fmt(buyQty)+" "+unitLabel(it.unit)+")",
      category: "Malighafi/Vyakula", amount: Number(buyCost),
      sellerName: purchaser, shiftId: session.role==="muuzaji" ? session.shiftId : null };
    setExpenses([expenseRec, ...(expenses||[])]);
    setBuyItemId(""); setBuyQty(""); setBuyCost("");
  }

  // Kiasi kilichopikwa (matumizi ya malighafi kwa kupika)
  const [useItemId, setUseItemId] = useState("");
  const [useQty, setUseQty] = useState("");
  const [useNote, setUseNote] = useState("");
  const [useDate, setUseDate] = useState(todayStr());
  const [useErr, setUseErr] = useState("");

  function submitUsage(e){
    e.preventDefault();
    setUseErr("");
    if(!useItemId || !useQty) return;
    if(isDateInClosedWeek(useDate, weeklyClosings)){
      setUseErr("Muhasibu ameshafunga stock ya wiki inayohusisha tarehe hii.");
      return;
    }
    const it = items.find(x=>x.id===useItemId);
    if(!it) return;
    if(Number(useQty) > (it.stock||0)){
      setUseErr("Kiasi kilichoandikwa ni zaidi ya stock iliyopo ya "+it.name+" (iliyopo: "+fmt(it.stock||0)+" "+unitLabel(it.unit)+").");
      return;
    }
    setRawStock(items.map(x => x.id===useItemId ? {...x, stock:(x.stock||0)-Number(useQty)} : x));
    const recordedBy = session.role==="muuzaji" ? session.sellerName : "Mmiliki";
    const usage = { id: genId(), itemId: useItemId, itemName: it.name, qty: Number(useQty), unit: it.unit,
      note: useNote.trim(), date: useDate, recordedBy };
    setRawUsageLogs([usage, ...(rawUsageLogs||[])]);
    setUseItemId(""); setUseQty(""); setUseNote("");
  }

  const sortedPurchases = [...(rawPurchases||[])].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const sortedUsage = [...(rawUsageLogs||[])].sort((a,b)=>(b.date||"").localeCompare(a.date||""));

  return (
    <div>
      <h2 className="page-title">Stock ya Malighafi</h2>
      <div className="readonly-note" style={{marginBottom:16}}>
        Malighafi hizi hazuuzwi moja kwa moja kwa mteja - zinanunuliwa na kutumika jikoni kupikia vyakula vilivyoko kwenye Menu.
      </div>

      {isOwner && (
        <div className="card">
          <h3>Ongeza Aina Mpya ya Malighafi</h3>
          <form className="form-grid" onSubmit={addRawItem}>
            <div className="field">
              <label>Jina la Malighafi</label>
