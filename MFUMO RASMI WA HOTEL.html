/* ---------- MAUZO (Sales / Orders - kutoka Menu pekee) ---------- */
function SalesPage({ menuItems, sales, setSales, session, sellers, weeklyClosings }){
  const isOwner = session.role === "mmiliki";
  const [cart, setCart] = useState([]);
  const [pickId, setPickId] = useState("");
  const [pickQty, setPickQty] = useState("1");
  const [paymentType, setPaymentType] = useState("taslimu");
  const [sellerFilter, setSellerFilter] = useState("wote");
  const [err, setErr] = useState("");

  const items = menuItems || [];
  const weekLocked = isDateInClosedWeek(todayStr(), weeklyClosings);

  function addToCart(e){
    e.preventDefault();
    setErr("");
    const it = items.find(x=>x.id===pickId);
    const q = Number(pickQty);
    if(!it || !q || q<=0){ setErr("Chagua kipengele na kiasi sahihi."); return; }
    const found = cart.find(c=>c.itemId===it.id);
    if(found){
      setCart(cart.map(c => c.itemId===it.id ? {...c, qty:c.qty+q} : c));
    } else {
      setCart([...cart, { itemId:it.id, name:it.name, category:it.category, price:it.price, qty:q }]);
    }
    setPickId(""); setPickQty("1");
  }

  function removeFromCart(itemId){
    setCart(cart.filter(c=>c.itemId!==itemId));
  }

  const cartTotal = cart.reduce((a,b)=>a+b.price*b.qty,0);

  function completeSale(){
    if(cart.length===0) return;
    if(isDateInClosedWeek(todayStr(), weeklyClosings)){
      setErr("Muhasibu ameshafunga wiki hii; huwezi kuongeza mauzo mapya ya wiki hii.");
      return;
    }
    const rec = {
      id: genId(), sellerName: session.sellerName, shiftId: session.shiftId || null,
      date: todayStr(), ts: Date.now(),
      items: cart.map(c=>({ name:c.name, category:c.category, qty:c.qty, price:c.price, subtotal:c.price*c.qty })),
      total: cartTotal, paymentType,
    };
    setSales([rec, ...(sales||[])]);
    setCart([]); setPaymentType("taslimu"); setErr("");
  }

  let visibleSales;
  if(isOwner){
    visibleSales = sellerFilter==="wote" ? (sales||[]) : (sales||[]).filter(s=>s.sellerName===sellerFilter);
  } else {
    visibleSales = (sales||[]).filter(s=>s.shiftId===session.shiftId);
  }
  const sellerNames = Array.from(new Set((sellers||[]).map(s=>s.name)));

  return (
    <div>
      <h2 className="page-title">Mauzo</h2>

      <div className="card">
        <h3>Tengeneza Oda Mpya</h3>
        {weekLocked && <div className="note-box" style={{marginBottom:12, borderColor:"var(--danger)", color:"var(--danger)"}}>
          Muhasibu ameshafunga mauzo ya wiki hii. Huwezi kuongeza mauzo mapya hadi wiki mpya ianze.
        </div>}
        {err && <div className="login-err" style={{display:"block"}}>{err}</div>}
        {items.length === 0 ? (
          <div className="empty">Bado hakuna kipengele kwenye Menu. Nenda kwenye ukurasa wa Menu kuongeza vyakula/vinywaji.</div>
        ) : (
          <form className="form-grid" onSubmit={addToCart} style={{marginBottom:16}}>
            <div className="field" style={{minWidth:200}}>
              <label>Chagua Kipengele cha Menu</label>
              <select value={pickId} onChange={e=>setPickId(e.target.value)}>
                <option value="">-- Chagua --</option>
                <optgroup label="Chakula">
                  {items.filter(i=>i.category==="chakula").map(i => <option key={i.id} value={i.id}>{i.name} (TSh {fmt(i.price)})</option>)}
                </optgroup>
                <optgroup label="Vinywaji">
                  {items.filter(i=>i.category==="kinywaji").map(i => <option key={i.id} value={i.id}>{i.name} (TSh {fmt(i.price)})</option>)}
                </optgroup>
              </select>
            </div>
            <div className="field">
              <label>Idadi</label>
              <input className="qty-input" type="number" min="1" value={pickQty} onChange={e=>setPickQty(e.target.value)} />
            </div>
            <div className="field">
              <button className="btn-primary" type="submit">Ongeza kwenye Oda</button>
            </div>
          </form>
        )}

        {cart.length === 0 ? (
          <div className="empty">Bado hujaongeza kitu kwenye oda.</div>
        ) : (
          <div>
            {cart.map(c => (
              <div className="cart-line" key={c.itemId}>
                <div>
                  <div className="ci-name">{c.name} <span className={"category-badge "+c.category}>{categoryLabel(c.category)}</span></div>
                  <div className="ci-sub">{fmt(c.qty)} x TSh {fmt(c.price)} = TSh {fmt(c.qty*c.price)}</div>
                </div>
                <button className="mini-btn danger" onClick={()=>removeFromCart(c.itemId)}>Ondoa</button>
              </div>
            ))}
            <div className="cart-total">Jumla: TSh {fmt(cartTotal)}</div>
            <div className="form-grid" style={{marginTop:14}}>
              <div className="field">
                <label>Aina ya Malipo</label>
                <select value={paymentType} onChange={e=>setPaymentType(e.target.value)}>
                  <option value="taslimu">Taslimu</option>
                  <option value="mkopo">Mkopo</option>
                </select>
              </div>
              <div className="field">
                <button className="btn-primary" type="button" onClick={completeSale} disabled={weekLocked}>Kamilisha Mauzo</button>
              </div>
            </div>
          </div>
        )}
      </div>

      <div className="card">
        <h3>{isOwner ? "Historia ya Mauzo" : "Mauzo ya Zamu Yako"}</h3>
        {isOwner && (
          <div className="field" style={{maxWidth:260, marginBottom:14}}>
            <label>Chuja kwa muuzaji</label>
            <select className="table-select" style={{maxWidth:260}} value={sellerFilter} onChange={e=>setSellerFilter(e.target.value)}>
              <option value="wote">-- Wote --</option>
              {sellerNames.map(n => <option key={n} value={n}>{n}</option>)}
            </select>
          </div>
        )}
        {visibleSales.length === 0 ? (
          <div className="empty">Bado hakuna mauzo yaliyorekodiwa.</div>
        ) : (
          <div className="table-wrap">
            <table>
              <thead><tr><th>Muda</th><th>Muuzaji</th><th>Vitu</th><th>Malipo</th><th>Jumla</th></tr></thead>
              <tbody>
                {visibleSales.map(s => (
                  <tr key={s.id}>
                    <td>{nowDisplayFromTs(s.ts)}</td>
                    <td>{s.sellerName}</td>
                    <td>{s.items.map(i=>i.name+" x"+fmt(i.qty)).join(", ")}</td>
                    <td>{s.paymentType==="mkopo" ? "Mkopo" : "Taslimu"}</td>
                    <td style={{fontWeight:700}}>{fmt(s.total)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- GHARAMA ZA UENDESHAJI ---------- */
function GharamaPage({ expenses, setExpenses, session, shifts, sellers, weeklyClosings, trash, setTrash }){
  const [date, setDate] = useState(todayStr());
  const [description, setDescription] = useState("");
  const [category, setCategory] = useState("Nyingine");
  const [amount, setAmount] = useState("");
  const [approvedBy, setApprovedBy] = useState("");
  const [sellerFilter, setSellerFilter] = useState("wote");
  const [lockErr, setLockErr] = useState("");

  const isOwner = session.role === "mmiliki";
  const isSeller = session.role === "muuzaji";
  const myShiftOpen = isSeller && (shifts||[]).some(sh => sh.id===session.shiftId && sh.status==="wazi");
  const weekLocked = isDateInClosedWeek(date, weeklyClosings);

  function submit(e){
    e.preventDefault();
    setLockErr("");
    if(!description.trim() || !amount) return;
    if(isDateInClosedWeek(date, weeklyClosings)){
      setLockErr("Muhasibu ameshafunga wiki inayohusisha tarehe hii; huwezi kuongeza gharama ya tarehe hiyo.");
      return;
    }
    let rec;
    if(isSeller){
      rec = { id: genId(), date, description: description.trim(), category, amount: Number(amount),
        sellerName: session.sellerName, shiftId: session.shiftId };
    } else {
      const who = approvedBy.trim() || "Mmiliki";
      rec = { id: genId(), date, description: description.trim(), category, amount: Number(amount),
        sellerName: who, shiftId: null };
    }
    setExpenses([rec, ...expenses]);
    setDescription(""); setAmount(""); setApprovedBy("");
  }

  function removeExpense(id){
    if(!window.confirm("Una uhakika unataka kufuta gharama hii? Itahifadhiwa kwenye Pipa la Taka la Mmiliki.")) return;
    const rec = expenses.find(e=>e.id===id);
    if(rec) pushToTrash(setTrash, trash, "gharama", rec.description+" - TSh "+fmt(rec.amount)+" ("+rec.date+")", rec, session.sellerName);
    setExpenses(expenses.filter(e=>e.id!==id));
  }

  let visibleExpenses;
  if(isSeller){
    visibleExpenses = expenses.filter(e => e.shiftId === session.shiftId);
  } else {
    visibleExpenses = sellerFilter === "wote" ? expenses : expenses.filter(e => (e.sellerName || "Mmiliki") === sellerFilter);
  }

  const sellerOptions = Array.from(new Set(
    ["Mmiliki", ...(sellers||[]).map(s=>s.name), ...expenses.map(e=>e.sellerName||"Mmiliki")]
  ));

  const today = todayStr();
  const todayExpenses = visibleExpenses.filter(e=>e.date===today);
  const todayTotal = todayExpenses.reduce((s,e)=>s+e.amount, 0);
  const allTotal = visibleExpenses.reduce((s,e)=>s+e.amount, 0);

  return (
    <div>
      <h2 className="page-title">Gharama za Uendeshaji</h2>

      {isSeller && (
        <div className="readonly-note" style={{marginBottom:16}}>
          Haya ni gharama za zamu yako ya sasa pekee ({session.sellerName}). Mmiliki ndiye anaona gharama za kila mfanyakazi.
        </div>
      )}
      <div className="note-box" style={{marginBottom:16}}>
        Ununuzi wa malighafi unaorekodiwa kwenye ukurasa wa "Stock ya Malighafi" unaongezwa hapa moja kwa moja.
      </div>

      <div className="summary-row">
        <div className="summary-box">
          <div className="label">{isSeller ? "Gharama za leo (zamu yako)" : "Gharama za leo"}</div>
          <div className="value">{fmt(todayTotal)}</div>
        </div>
        <div className="summary-box">
          <div className="label">{isSeller ? "Jumla ya gharama za zamu yako" : "Jumla ya gharama (kwa uchujaji)"}</div>
          <div className="value">{fmt(allTotal)}</div>
        </div>
      </div>

      <div className="card">
        <h3>Ongeza Gharama</h3>
        {isSeller && !myShiftOpen && (
          <div className="note-box" style={{marginBottom:12}}>Zamu yako imefungwa; huwezi kuongeza gharama mpya.</div>
        )}
        {(weekLocked || lockErr) && (
          <div className="note-box" style={{marginBottom:12, borderColor:"var(--danger)", color:"var(--danger)"}}>
            {lockErr || "Muhasibu ameshafunga wiki inayohusisha tarehe uliyochagua."}
          </div>
        )}
        <form className="form-grid" onSubmit={submit}>
          <div className="field">
            <label>Tarehe</label>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} />
          </div>
          <div className="field">
            <label>Maelezo</label>
            <input value={description} onChange={e=>setDescription(e.target.value)} placeholder="mf. Nauli, Gesi..." />
          </div>
          <div className="field">
            <label>Aina</label>
            <select value={category} onChange={e=>setCategory(e.target.value)}>
              <option>Malighafi/Vyakula</option>
              <option>Gesi/Umeme/Maji</option>
              <option>Usafiri</option>
              <option>Mishahara</option>
              <option>Matengenezo</option>
              <option>Kodi</option>
              <option>Nyingine</option>
            </select>
          </div>
          <div className="field">
            <label>Kiasi</label>
            <input type="number" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0" />
          </div>
          {isOwner && (
            <div className="field">
              <label>Aliyeidhinisha/Aliyetumia (hiari)</label>
              <input value={approvedBy} onChange={e=>setApprovedBy(e.target.value)} placeholder="mf. Mmiliki au jina la mfanyakazi" />
            </div>
          )}
          <div className="field">
            <button className="btn-primary" type="submit" disabled={(isSeller && !myShiftOpen) || weekLocked}>Ongeza</button>
          </div>
        </form>
      </div>

      <div className="card">
        <h3>Historia ya Gharama</h3>
        {isOwner && (
          <div className="field" style={{maxWidth:260, marginBottom:14}}>
            <label>Chuja kwa aliyetumia/aliyeidhinisha</label>
            <select className="table-select" style={{maxWidth:260}} value={sellerFilter} onChange={e=>setSellerFilter(e.target.value)}>
              <option value="wote">-- Wote --</option>
              {sellerOptions.map(name => <option key={name} value={name}>{name}</option>)}
            </select>
          </div>
        )}
        {visibleExpenses.length === 0 ? (
          <div className="empty">Bado hakuna gharama zilizorekodiwa.</div>
        ) : (
          <div className="table-wrap">
            <table>
              <thead>
                <tr><th>Tarehe</th><th>Maelezo</th><th>Aina</th><th>Kiasi</th><th>Aliyeidhinisha/Alitumia</th><th>Vitendo</th></tr>
              </thead>
              <tbody>
                {visibleExpenses.map(e => (
                  <tr key={e.id}>
                    <td>{e.date}</td><td>{e.description}</td><td>{e.category}</td><td>{fmt(e.amount)}</td>
                    <td>{e.sellerName || "Mmiliki"}</td>
                    <td><button className="mini-btn danger" onClick={()=>removeExpense(e.id)}>Futa</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- WAFANYAKAZI (Staff registered by owner, individual passwords) ---------- */
function WafanyakaziPage({ sellers, setSellers, shifts, attendanceLogs, setAttendanceLogs, session, trash, setTrash }){
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [password, setPassword] = useState("");
  const [newRoles, setNewRoles] = useState(["muuzaji"]);
  const [attDate, setAttDate] = useState(todayStr());
  const isOwner = session.role === "mmiliki";

  function toggleNewRole(key){
    setNewRoles(newRoles.includes(key) ? newRoles.filter(r=>r!==key) : [...newRoles, key]);
  }

  function addSeller(e){
    e.preventDefault();
    if(!name.trim() || !password.trim()) return;
    const rec = { id: genId(), name: name.trim(), phone: phone.trim(), password: password.trim(), roles: newRoles,
      active: true, salary: 0, salaryHistory: [] };
    setSellers([rec, ...(sellers||[])]);
    setName(""); setPhone(""); setPassword(""); setNewRoles(["muuzaji"]);
  }

  function toggleSellerRole(sellerId, key){
    setSellers(sellers.map(s => {
      if(s.id !== sellerId) return s;
      const cur = s.roles || [];
      const next = cur.includes(key) ? cur.filter(r=>r!==key) : [...cur, key];
      return {...s, roles: next};
    }));
  }

  function toggleActive(sellerId){
    const s = sellers.find(x=>x.id===sellerId);
    if(!s) return;
    const nowActive = s.active !== false;
    if(nowActive){
      if(!window.confirm("Una uhakika unataka kumfukuza "+s.name+"? Hataweza kuingia tena mfumoni hadi arejeshwe kazini.")) return;
    }
    setSellers(sellers.map(x => x.id===sellerId ? {...x, active: !nowActive} : x));
  }

  function editSeller(id){
    const s = sellers.find(x=>x.id===id);
    const newName = window.prompt("Jina la mfanyakazi:", s.name);
    if(newName === null) return;
    const newPhone = window.prompt("Namba ya simu:", s.phone || "");
    if(newPhone === null) return;
    const newPass = window.prompt("Password mpya:", s.password);
    if(newPass === null) return;
    setSellers(sellers.map(x => x.id===id ? {...x, name:newName.trim()||x.name, phone:newPhone.trim(), password:newPass.trim()||x.password} : x));
  }

  function removeSeller(id){
    if(!window.confirm("Una uhakika unataka kumfuta mfanyakazi huyu? Taarifa zake zitahifadhiwa kwenye Pipa la Taka la Mmiliki.")) return;
    const rec = sellers.find(s=>s.id===id);
    if(rec) pushToTrash(setTrash, trash, "seller", rec.name+(rec.phone?" ("+rec.phone+")":""), rec, session.sellerName);
    setSellers(sellers.filter(s=>s.id!==id));
  }

  // Mshahara (Mmiliki pekee anaona sehemu hii)
  const [salarySellerId, setSalarySellerId] = useState("");
  const [salaryAmount, setSalaryAmount] = useState("");
  const [salaryDate, setSalaryDate] = useState(todayStr());
  const [salaryNote, setSalaryNote] = useState("");

  function updateSalary(e){
    e.preventDefault();
    if(!salarySellerId || !salaryAmount) return;
    const s = sellers.find(x=>x.id===salarySellerId);
    if(!s) return;
    const oldAmount = s.salary || 0;
    const newAmount = Number(salaryAmount);
    const historyEntry = { id: genId(), date: salaryDate, oldAmount, newAmount, note: salaryNote.trim(),
      changedBy: session.sellerName };
    setSellers(sellers.map(x => x.id===salarySellerId ? {
      ...x, salary: newAmount, salaryHistory: [historyEntry, ...(x.salaryHistory||[])]
    } : x));
    setSalarySellerId(""); setSalaryAmount(""); setSalaryNote("");
  }

  const allSalaryHistory = [];
  (sellers||[]).forEach(s => {
    (s.salaryHistory||[]).forEach(h => allSalaryHistory.push({...h, sellerName: s.name}));
  });
  allSalaryHistory.sort((a,b)=>(b.date||"").localeCompare(a.date||""));


  function shiftDuration(sh){
    if(!sh.logoutTime) return "Zamu inaendelea";
    const mins = Math.round((sh.logoutTime - sh.loginTime)/60000);
    const h = Math.floor(mins/60), m = mins%60;
    return h>0 ? h+"saa "+m+"dk" : m+"dk";
  }

  // Mahudhurio ya Kazi (HR/Mmiliki pekee, ukurasa huu tayari umefungiwa kwa HR/Mmiliki)
  function attendanceFor(sellerId, date){
    return (attendanceLogs||[]).find(a=>a.sellerId===sellerId && a.date===date);
  }
  function toggleAttendance(seller, date){
    const existing = attendanceFor(seller.id, date);
    if(existing){
      setAttendanceLogs((attendanceLogs||[]).map(a => a.id===existing.id ? {...a, present: !a.present} : a));
    } else {
      setAttendanceLogs([{ id: genId(), sellerId: seller.id, sellerName: seller.name, date, present: true,
        recordedBy: session.sellerName }, ...(attendanceLogs||[])]);
    }
  }

  const sortedShifts = [...(shifts||[])].sort((a,b)=>b.loginTime-a.loginTime);
  const attendanceHistory = [...(attendanceLogs||[])].sort((a,b)=>(b.date||"").localeCompare(a.date||""));

  return (
    <div>
      <h2 className="page-title">Wafanyakazi na Zamu</h2>

      <div className="card">
        <h3>Sajili Mfanyakazi Mpya</h3>
        <form className="form-grid" onSubmit={addSeller} style={{marginBottom:14}}>
          <div className="field">
            <label>Jina la Mfanyakazi</label>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="mf. Juma Hassan" />
          </div>
          <div className="field">
            <label>Namba ya Simu</label>
            <input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="mf. 07XXXXXXXX" />
          </div>
          <div className="field">
            <label>Password Yake Binafsi</label>
            <input value={password} onChange={e=>setPassword(e.target.value)} placeholder="mf. juma1234" />
          </div>
          <div className="field">
            <button className="btn-primary" type="submit">Sajili</button>
          </div>
        </form>
        <div className="field" style={{marginBottom:0}}>
          <label>Majukumu (unaweza kuchagua zaidi ya moja)</label>
          <div className="row-actions">
            {ROLE_OPTIONS.map(r => (
              <button key={r.key} type="button"
                className={"subtab-btn "+(newRoles.includes(r.key)?"active":"")}
                onClick={()=>toggleNewRole(r.key)}>{r.label}</button>
            ))}
          </div>
        </div>
        <div className="note-box" style={{marginTop:14}}>
          Kila mfanyakazi ataingia kwa jina lake na password yake binafsi kuanza zamu. Akimaliza zamu, atabonyeza "Maliza Zamu" na mfanyakazi mwingine ataweza kuingia.
          Muuzaji mwenye jukumu la "Muhasibu" ataweza kuona ukurasa wa "Ukaguzi wa Mahesabu" (mauzo, matumizi na madeni). Muuzaji mwenye jukumu la "HR" ataweza kufikia ukurasa huu wa Wafanyakazi kusajili, kufukuza, au kuongeza wafanyakazi na kuweka mahudhurio (isipokuwa taarifa za mshahara, ambazo ni za Mmiliki pekee). Mtu mmoja anaweza kupewa majukumu zaidi ya moja, mfano Muuzaji na Muhasibu.
        </div>
      </div>

      <div className="card">
        <h3>Orodha ya Wafanyakazi</h3>
        {(!sellers || sellers.length===0) ? (
          <div className="empty">Bado hakuna mfanyakazi aliyesajiliwa.</div>
        ) : (
          <div className="table-wrap">
            <table>
              <thead><tr><th>Jina</th><th>Simu</th><th>Password</th><th>Majukumu</th><th>Hali</th><th>Vitendo</th></tr></thead>
              <tbody>
                {sellers.map(s => (
                  <tr key={s.id}>
                    <td>{s.name}</td><td>{s.phone || "-"}</td><td>{s.password}</td>
                    <td>
                      <div className="row-actions">
                        {ROLE_OPTIONS.map(r => (
                          <button key={r.key} type="button"
                            className={"mini-btn "+((s.roles||[]).includes(r.key) ? "" : "")}
                            style={(s.roles||[]).includes(r.key) ? {background:"var(--spice-700)", color:"#fff", borderColor:"var(--spice-700)"} : {}}
                            onClick={()=>toggleSellerRole(s.id, r.key)}>{r.label}</button>
                        ))}
                      </div>
                    </td>
                    <td className={s.active!==false ? "shift-open" : "shift-closed"}>
                      {s.active!==false ? "Anafanya Kazi" : "Amefukuzwa"}
                    </td>
                    <td>
                      <div className="row-actions">
                        <button className="mini-btn" onClick={()=>editSeller(s.id)}>Hariri</button>
                        <button className={"mini-btn"+(s.active!==false ? " danger" : "")} onClick={()=>toggleActive(s.id)}>
                          {s.active!==false ? "Fukuza" : "Rejesha Kazini"}
                        </button>
                        <button className="mini-btn danger" onClick={()=>removeSeller(s.id)}>Futa Kabisa</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {isOwner && (
        <div className="card" style={{borderColor:"var(--gold-600)"}}>
          <h3>Mishahara (Inaonekana kwa Mmiliki Pekee)</h3>
          <div className="note-box" style={{marginBottom:14}}>
            Taarifa za mshahara ni siri, zinaonekana kwa Mmiliki pekee — hata HR haziwezi kuziona.
          </div>
          {(!sellers || sellers.length===0) ? (
            <div className="empty">Bado hakuna mfanyakazi aliyesajiliwa.</div>
          ) : (
            <React.Fragment>
              <form className="form-grid" onSubmit={updateSalary} style={{marginBottom:16}}>
                <div className="field">
                  <label>Chagua Mfanyakazi</label>
                  <select value={salarySellerId} onChange={e=>setSalarySellerId(e.target.value)}>
                    <option value="">-- Chagua --</option>
                    {sellers.map(s => <option key={s.id} value={s.id}>{s.name} (sasa: {fmt(s.salary||0)})</option>)}
                  </select>
                </div>
                <div className="field">
                  <label>Mshahara Mpya</label>
                  <input type="number" value={salaryAmount} onChange={e=>setSalaryAmount(e.target.value)} placeholder="TSh" />
                </div>
                <div className="field">
                  <label>Tarehe</label>
                  <input type="date" value={salaryDate} onChange={e=>setSalaryDate(e.target.value)} />
                </div>
                <div className="field">
                  <label>Maelezo (hiari)</label>
                  <input value={salaryNote} onChange={e=>setSalaryNote(e.target.value)} placeholder="mf. Ongezeko la mwaka" />
                </div>
                <div className="field">
                  <button className="btn-primary" type="submit">Hifadhi Mshahara</button>
                </div>
              </form>

              <div className="table-wrap">
                <table>
                  <thead><tr><th>Jina</th><th>Mshahara wa Sasa</th></tr></thead>
                  <tbody>
                    {sellers.map(s => (
                      <tr key={s.id}>
                        <td>{s.name}</td><td style={{fontWeight:700}}>{fmt(s.salary||0)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              {allSalaryHistory.length > 0 && (
                <div className="table-wrap" style={{marginTop:16}}>
                  <table>
                    <thead><tr><th>Tarehe</th><th>Mfanyakazi</th><th>Kutoka</th><th>Kwenda</th><th>Aina</th><th>Maelezo</th></tr></thead>
                    <tbody>
                      {allSalaryHistory.slice(0,60).map(h => (
                        <tr key={h.id}>
                          <td>{h.date}</td><td>{h.sellerName}</td>
                          <td>{fmt(h.oldAmount)}</td><td>{fmt(h.newAmount)}</td>
                          <td style={{color: h.newAmount>h.oldAmount ? "var(--ok)" : (h.newAmount<h.oldAmount ? "var(--danger)" : "var(--muted)")}}>
                            {h.newAmount>h.oldAmount ? "Ongezeko" : (h.newAmount<h.oldAmount ? "Punguzo" : "Hakuna Mabadiliko")}
                          </td>
                          <td>{h.note || "-"}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </React.Fragment>
          )}
        </div>
      )}

      <div className="card">
        <h3>Mahudhurio ya Kazi</h3>
        <div className="note-box" style={{marginBottom:14}}>
          HR/Mmiliki anaweka hapa ni wafanyakazi gani waliohudhuria kazi kwa tarehe husika.
        </div>
        <div className="field" style={{maxWidth:220, marginBottom:14}}>
          <label>Tarehe</label>
          <input type="date" value={attDate} onChange={e=>setAttDate(e.target.value)} />
        </div>
        {(!sellers || sellers.length===0) ? (
          <div className="empty">Bado hakuna mfanyakazi aliyesajiliwa.</div>
        ) : (
          <div className="table-wrap">
            <table>
              <thead><tr><th>Jina</th><th>Alihudhuria?</th></tr></thead>
              <tbody>
                {sellers.map(s => {
                  const att = attendanceFor(s.id, attDate);
                  const present = att ? att.present : false;
                  return (
                    <tr key={s.id}>
                      <td>{s.name}</td>
                      <td>
                        <button className={"mini-btn"+(present?"":" danger")}
                          style={present ? {background:"var(--ok)", color:"#fff", borderColor:"var(--ok)"} : {}}
                          onClick={()=>toggleAttendance(s, attDate)}>
                          {present ? "Alihudhuria" : "Hakuhudhuria"}
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
        {attendanceHistory.length > 0 && (
          <div className="table-wrap" style={{marginTop:16}}>
            <table>
              <thead><tr><th>Tarehe</th><th>Mfanyakazi</th><th>Hali</th><th>Aliyerekodi</th></tr></thead>
              <tbody>
                {attendanceHistory.slice(0,60).map(a => (
                  <tr key={a.id}>
                    <td>{a.date}</td><td>{a.sellerName}</td>
                    <td className={a.present ? "shift-open" : "shift-closed"}>{a.present ? "Alihudhuria" : "Hakuhudhuria"}</td>
                    <td>{a.recordedBy}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      <div className="card">
        <h3>Historia ya Zamu</h3>
        {sortedShifts.length === 0 ? (
          <div className="empty">Bado hakuna zamu iliyorekodiwa.</div>
        ) : (
          <div className="table-wrap">
            <table>
              <thead>
                <tr><th>Mfanyakazi</th><th>Kuingia</th><th>Kutoka</th><th>Muda</th><th>Taslimu</th><th>Mkopo</th><th>Oda</th><th>Hali</th></tr>
              </thead>
              <tbody>
                {sortedShifts.map(sh => (
                  <tr key={sh.id}>
                    <td>{sh.sellerName}</td>
                    <td>{sh.loginDisplay}</td>
                    <td>{sh.logoutDisplay || "-"}</td>
                    <td>{shiftDuration(sh)}</td>
                    <td>{fmt(sh.totalCash)}</td>
                    <td>{fmt(sh.totalMkopo)}</td>
                    <td>{sh.ordersCount||0}</td>
                    <td className={sh.status==="wazi" ? "shift-open" : "shift-closed"}>{sh.status==="wazi" ? "Zamu Inaendelea" : "Imefungwa"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- WATEJA (Special customer orders & delivery assignment) ---------- */
function WatejaPage({ customerOrders, setCustomerOrders, distributors, setDistributors,
  dutyLogs, setDutyLogs, sellers, session, trash, setTrash, businessInfo }){
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [location, setLocation] = useState("");
  const [orderNote, setOrderNote] = useState("");
  const [amount, setAmount] = useState("");
  const [date, setDate] = useState(todayStr());
  const [delivererChoice, setDelivererChoice] = useState("");
  const [statusFilter, setStatusFilter] = useState("wote");

  // Msambazaji: wafanyakazi wenye jukumu la "msambazaji" + majina huru yaliyoongezwa na muuzaji
  const [distName, setDistName] = useState("");
  const [distPhone, setDistPhone] = useState("");

  function addDistributor(e){
    e.preventDefault();
    if(!distName.trim()) return;
    const rec = { id: genId(), name: distName.trim(), phone: distPhone.trim(), addedBy: session.sellerName };
    setDistributors([rec, ...(distributors||[])]);
    setDistName(""); setDistPhone("");
  }

  function removeDistributor(id){
    if(!window.confirm("Una uhakika unataka kufuta jina hili la msambazaji? Litahifadhiwa kwenye Pipa la Taka la Mmiliki.")) return;
    const rec = (distributors||[]).find(d=>d.id===id);
    if(rec) pushToTrash(setTrash, trash, "distributor", rec.name+(rec.phone?" ("+rec.phone+")":""), rec, session.sellerName);
    setDistributors((distributors||[]).filter(d=>d.id!==id));
  }

  const staffDeliverers = (sellers||[]).filter(s => (s.roles||[]).includes("msambazaji"));
  const otherStaff = (sellers||[]).filter(s => !(s.roles||[]).includes("msambazaji"));
  const delivererChoices = [
    ...staffDeliverers.map(s => ({ key:"staff-"+s.id, label:s.name+" (Msambazaji - Mfanyakazi)" })),
    ...(distributors||[]).map(d => ({ key:"dist-"+d.id, label:d.name+(d.phone ? " ("+d.phone+")" : "")+" (Msambazaji wa Nje)" })),
    ...otherStaff.map(s => ({ key:"staff-"+s.id, label:s.name })),
  ];

  function submit(e){
    e.preventDefault();
    if(!name.trim() || !phone.trim()) return;
    const chosen = delivererChoices.find(d=>d.key===delivererChoice);
    const rec = { id: genId(), name: name.trim(), phone: phone.trim(), location: location.trim(),
      orderNote: orderNote.trim(), amount: Number(amount)||0, date, delivererName: chosen ? chosen.label.replace(/ \(.*\)$/,"") : "",
      recordedBy: session.sellerName, status:"inasubiri" };
    setCustomerOrders([rec, ...(customerOrders||[])]);
    setName(""); setPhone(""); setLocation(""); setOrderNote(""); setAmount(""); setDelivererChoice("");
  }

  function printReceipt(c){
    const bi = businessInfo || {};
    const win = window.open("", "_blank", "width=380,height=600");
    if(!win) return;
    const rows = [
      ["Hoteli", bi.hotelName || "-"],
      ["Mtaa/Mkoa", [bi.mtaa, bi.wilaya, bi.mkoa].filter(Boolean).join(", ") || "-"],
      ["Tarehe", c.date],
      ["Mteja", c.name],
      ["Simu ya Mteja", c.phone],
      ["Mahali", c.location || "-"],
      ["Oda", c.orderNote || "-"],
      ["Anayepeleka", c.delivererName || "-"],
      ["Hali", c.status==="imepelekwa" ? "Imepelekwa" : "Inasubiri"],
    ];
    const rowsHtml = rows.map(r => "<tr><td style='color:#666;padding:4px 8px;'>"+r[0]+"</td><td style='padding:4px 8px;font-weight:600;'>"+r[1]+"</td></tr>").join("");
    win.document.write(
      "<html><head><title>Risiti - "+c.name+"</title></head><body style='font-family:sans-serif;padding:16px;'>"+
      "<h2 style='margin-bottom:4px;'>Risiti ya Oda</h2>"+
      "<table style='width:100%;border-collapse:collapse;font-size:14px;'>"+rowsHtml+"</table>"+
      "<div style='margin-top:14px;font-size:18px;font-weight:700;'>Kiasi: TSh "+fmt(c.amount||0)+"</div>"+
      "<div style='margin-top:24px;font-size:12px;color:#888;'>Asante kwa oda yako!</div>"+
      "</body></html>"
    );
    win.document.close();
    win.focus();
    win.print();
  }

  function toggleStatus(id){
    setCustomerOrders((customerOrders||[]).map(c => c.id===id ? {...c, status: c.status==="inasubiri" ? "imepelekwa" : "inasubiri"} : c));
  }

  function removeOrder(id){
    if(!window.confirm("Una uhakika unataka kufuta oda hii ya mteja? Itahifadhiwa kwenye Pipa la Taka la Mmiliki.")) return;
    const rec = (customerOrders||[]).find(c=>c.id===id);
    if(rec) pushToTrash(setTrash, trash, "customerOrder", rec.name+" - "+rec.phone+" ("+rec.date+")", rec, session.sellerName);
    setCustomerOrders((customerOrders||[]).filter(c=>c.id!==id));
  }

  // Majukumu ya Leo (nani anahudumia, nani anapeleka oda leo)
  const [dutySellerId, setDutySellerId] = useState("");
  const [dutyType, setDutyType] = useState("anahudumia");
  const [dutyDate, setDutyDate] = useState(todayStr());

  function addDutyLog(e){
    e.preventDefault();
    const s = (sellers||[]).find(x=>x.id===dutySellerId);
    if(!s) return;
    const rec = { id: genId(), date: dutyDate, sellerName: s.name, duty: dutyType, assignedBy: session.sellerName };
    setDutyLogs([rec, ...(dutyLogs||[])]);
    setDutySellerId("");
  }

  function removeDutyLog(id){
    const rec = (dutyLogs||[]).find(d=>d.id===id);
    if(rec) pushToTrash(setTrash, trash, "dutyLog", rec.sellerName+" - "+dutyLabel(rec.duty)+" ("+rec.date+")", rec, session.sellerName);
    setDutyLogs((dutyLogs||[]).filter(d=>d.id!==id));
  }

  function dutyLabel(d){ return d==="anapeleka" ? "Anapeleka Oda" : "Anahudumia Wateja"; }

  const list = customerOrders || [];
  const visible = statusFilter==="wote" ? list : list.filter(c=>c.status===statusFilter);
  const sorted = [...visible].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const todayDuty = (dutyLogs||[]).filter(d=>d.date===todayStr());

  return (
    <div>
      <h2 className="page-title">Wateja (Oda Maalumu)</h2>
      <div className="readonly-note" style={{marginBottom:16}}>
        Andika hapa oda maalumu za wateja (mfano wanaopiga simu au wanaotaka kupelekewa), pamoja na anayewapelekea miongoni mwa wafanyakazi au wasambazaji wa nje.
      </div>

      <div className="card">
        <h3>Majukumu ya Leo</h3>
        <div className="note-box" style={{marginBottom:14}}>
          Muuzaji aliyeko zamu anaweza kuweka hapa nani anahudumia wateja na nani anapeleka oda siku ya leo.
        </div>
        {(!sellers || sellers.length===0) ? (
          <div className="empty">Bado hakuna mfanyakazi aliyesajiliwa.</div>
        ) : (
          <form className="form-grid" onSubmit={addDutyLog} style={{marginBottom:14}}>
            <div className="field">
              <label>Chagua Mfanyakazi</label>
              <select value={dutySellerId} onChange={e=>setDutySellerId(e.target.value)}>
                <option value="">-- Chagua --</option>
                {sellers.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
            </div>
            <div className="field">
              <label>Jukumu la Leo</label>
              <select value={dutyType} onChange={e=>setDutyType(e.target.value)}>
                <option value="anahudumia">Anahudumia Wateja</option>
                <option value="anapeleka">Anapeleka Oda</option>
              </select>
            </div>
            <div className="field">
              <label>Tarehe</label>
              <input type="date" value={dutyDate} onChange={e=>setDutyDate(e.target.value)} />
            </div>
            <div className="field">
              <button className="btn-primary" type="submit">Weka Jukumu</button>
            </div>
          </form>
        )}
        {todayDuty.length === 0 ? (
          <div className="empty">Bado hakuna majukumu yaliyowekwa kwa leo.</div>
        ) : (
          <div className="table-wrap">
            <table>
              <thead><tr><th>Mfanyakazi</th><th>Jukumu</th><th>Aliyeweka</th><th>Vitendo</th></tr></thead>
              <tbody>
                {todayDuty.map(d => (
                  <tr key={d.id}>
                    <td>{d.sellerName}</td><td>{dutyLabel(d.duty)}</td><td>{d.assignedBy}</td>
                    <td><button className="mini-btn danger" onClick={()=>removeDutyLog(d.id)}>Futa</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      <div className="card">
        <h3>Majina ya Wasambazaji wa Nje</h3>
        <div className="note-box" style={{marginBottom:14}}>
          Ongeza hapa majina ya wasambazaji wasiokuwa kwenye mfumo (mfano bodaboda), ili wapatikane kwenye orodha ya "Anayepeleka Oda".
        </div>
        <form className="form-grid" onSubmit={addDistributor} style={{marginBottom:14}}>
          <div className="field">
            <label>Jina la Msambazaji</label>
            <input value={distName} onChange={e=>setDistName(e.target.value)} placeholder="mf. Boda Juma" />
          </div>
          <div className="field">
            <label>Namba ya Simu (hiari)</label>
            <input value={distPhone} onChange={e=>setDistPhone(e.target.value)} placeholder="mf. 07XXXXXXXX" />
          </div>
          <div className="field">
            <button className="btn-primary" type="submit">Ongeza Msambazaji</button>
          </div>
        </form>
        {(!distributors || distributors.length===0) ? (
          <div className="empty">Bado hakuna msambazaji wa nje aliyeongezwa.</div>
        ) : (
          <div className="table-wrap">
            <table>
              <thead><tr><th>Jina</th><th>Simu</th><th>Aliyeongeza</th><th>Vitendo</th></tr></thead>
              <tbody>
                {distributors.map(d => (
                  <tr key={d.id}>
                    <td>{d.name}</td><td>{d.phone || "-"}</td><td>{d.addedBy}</td>
                    <td><button className="mini-btn danger" onClick={()=>removeDistributor(d.id)}>Futa</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      <div className="card">
        <h3>Ongeza Oda ya Mteja</h3>
        <form className="form-grid" onSubmit={submit}>
          <div className="field">
            <label>Jina la Mteja</label>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="mf. Mama Amina" />
          </div>
          <div className="field">
            <label>Namba ya Simu</label>
            <input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="mf. 07XXXXXXXX" />
          </div>
          <div className="field">
            <label>Mahali Anapopatikana</label>
            <input value={location} onChange={e=>setLocation(e.target.value)} placeholder="mf. Mtaa wa Kariakoo, karibu na..." />
          </div>
          <div className="field">
            <label>Maelezo ya Oda</label>
            <input value={orderNote} onChange={e=>setOrderNote(e.target.value)} placeholder="mf. Wali kuku 2, soda 1" />
          </div>
          <div className="field">
            <label>Kiasi cha Oda (hiari, kwa risiti)</label>
            <input type="number" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="TSh" />
          </div>
          <div className="field">
            <label>Tarehe</label>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} />
          </div>
          <div className="field">
            <label>Anayepeleka Oda</label>
            <select value={delivererChoice} onChange={e=>setDelivererChoice(e.target.value)}>
              <option value="">-- Chagua --</option>
              {delivererChoices.map(d => <option key={d.key} value={d.key}>{d.label}</option>)}
            </select>
          </div>
          <div className="field">
            <button className="btn-primary" type="submit">Hifadhi Oda</button>
          </div>
        </form>
      </div>

      <div className="card">
        <h3>Orodha ya Oda za Wateja</h3>
        <div className="field" style={{maxWidth:220, marginBottom:14}}>
          <label>Chuja kwa hali</label>
          <select className="table-select" style={{maxWidth:220}} value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
            <option value="wote">-- Wote --</option>
            <option value="inasubiri">Inasubiri</option>
            <option value="imepelekwa">Imepelekwa</option>
          </select>
        </div>
        {sorted.length === 0 ? (
          <div className="empty">Bado hakuna oda ya mteja iliyorekodiwa.</div>
        ) : (
          <div className="table-wrap">
            <table>
              <thead>
                <tr><th>Tarehe</th><th>Mteja</th><th>Simu</th><th>Mahali</th><th>Oda</th><th>Kiasi</th><th>Anayepeleka</th><th>Hali</th><th>Vitendo</th></tr>
              </thead>
              <tbody>
                {sorted.map(c => (
                  <tr key={c.id}>
                    <td>{c.date}</td><td>{c.name}</td><td>{c.phone}</td><td>{c.location || "-"}</td>
                    <td>{c.orderNote || "-"}</td><td>{c.amount ? fmt(c.amount) : "-"}</td><td>{c.delivererName || "-"}</td>
                    <td className={c.status==="imepelekwa" ? "shift-open" : "shift-closed"}>
                      {c.status==="imepelekwa" ? "Imepelekwa" : "Inasubiri"}
                    </td>
                    <td>
                      <div className="row-actions">
                        <a className="mini-btn" href={"tel:"+c.phone}>Piga Simu</a>
                        <a className="mini-btn" href={"sms:"+c.phone}>SMS</a>
                        <button className="mini-btn" onClick={()=>printReceipt(c)}>Risiti</button>
                        <button className="mini-btn" onClick={()=>toggleStatus(c.id)}>
                          {c.status==="imepelekwa" ? "Rudisha Inasubiri" : "Weka Imepelekwa"}
                        </button>
                        <button className="mini-btn danger" onClick={()=>removeOrder(c.id)}>Futa</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- UKAGUZI WA MAHESABU (Owner-only, password protected) ---------- */
function UkaguziPage({ sales, expenses, rawStock, businessInfo, weeklyClosings, setWeeklyClosings, session }){
  const [unlocked, setUnlocked] = useState(false);
  const [pwd, setPwd] = useState("");
  const [err, setErr] = useState("");
  const [period, setPeriod] = useState("leo");

  const correctPwd = (businessInfo && businessInfo.auditPassword) || "ukaguzi2026";

  function submitPwd(e){
    e.preventDefault();
    if(pwd === correctPwd){ setUnlocked(true); setErr(""); }
    else setErr("Password si sahihi.");
  }

  if(!unlocked){
    return (
      <div>
        <h2 className="page-title">Ukaguzi wa Mahesabu</h2>
        <div className="card" style={{maxWidth:400}}>
          <h3>Ingiza Password ya Ukaguzi</h3>
          <form onSubmit={submitPwd}>
            <div className="field">
              <label>Password Maalumu ya Mmiliki</label>
              <input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} autoFocus />
            </div>
            {err && <div className="login-err" style={{display:"block"}}>{err}</div>}
            <button className="btn-primary" type="submit">Fungua Ukaguzi</button>
          </form>
          <div className="note-box" style={{marginTop:14}}>
            Password hii inawekwa/kubadilishwa na Mmiliki kwenye ukurasa wa "Taarifa" &rarr; "Hariri Taarifa".
            Kama bado haijawekwa, tumia password ya kawaida: <b>ukaguzi2026</b>.
          </div>
        </div>
      </div>
    );
  }

  const periodSales = (sales||[]).filter(s=>inPeriod(s.date, period));
  const taslimuTotal = periodSales.filter(s=>s.paymentType==="taslimu").reduce((a,b)=>a+b.total,0);
  const mkopoTotal = periodSales.filter(s=>s.paymentType==="mkopo").reduce((a,b)=>a+b.total,0);
  const mauzoJumla = taslimuTotal + mkopoTotal;
  const periodExpenses = (expenses||[]).filter(e=>inPeriod(e.date, period));
  const periodExpensesTotal = periodExpenses.reduce((a,b)=>a+b.amount,0);
  const pesaIliyopo = taslimuTotal - periodExpensesTotal;

  const sellerMap = {};
  periodSales.forEach(s => {
    const key = s.sellerName || "Bila Muuzaji";
    if(!sellerMap[key]) sellerMap[key] = { name:key, count:0, cash:0, mkopo:0, total:0 };
    sellerMap[key].count += 1;
    if(s.paymentType === "taslimu") sellerMap[key].cash += s.total; else sellerMap[key].mkopo += s.total;
    sellerMap[key].total += s.total;
  });
  const sellerRows = Object.values(sellerMap).sort((a,b)=>b.total-a.total);

  const expenseMap = {};
  periodExpenses.forEach(ex => {
    const key = ex.sellerName || "Mmiliki";
    if(!expenseMap[key]) expenseMap[key] = { name:key, count:0, total:0 };
    expenseMap[key].count += 1;
    expenseMap[key].total += ex.amount;
  });
  const expenseRows = Object.values(expenseMap).sort((a,b)=>b.total-a.total);

  const itemMap = {};
  periodSales.forEach(s => {
    (s.items||[]).forEach(it => {
      const key = it.name;
      if(!itemMap[key]) itemMap[key] = { name:key, category:it.category, qty:0, revenue:0 };
      itemMap[key].qty += it.qty;
      itemMap[key].revenue += it.subtotal;
    });
  });
  const bestSellerRows = Object.values(itemMap).sort((a,b)=>b.qty-a.qty);

  const lowStockItems = (rawStock||[]).filter(it=>(it.stock||0) <= LOW_STOCK_THRESHOLD);

  const periodLabels = { leo:"Leo", wiki:"Wiki Hii (siku 7)", mwezi:"Mwezi Huu", yote:"Muda Wote" };

  // Kufunga Wiki (Mauzo na Stock)
  const currentWeek = getCurrentWeekRange();
  const alreadyClosedCurrent = (weeklyClosings||[]).find(w=>w.start===currentWeek.start);
  const weekSales = (sales||[]).filter(s => s.date >= currentWeek.start && s.date <= currentWeek.end);
  const weekExpenses = (expenses||[]).filter(e => e.date >= currentWeek.start && e.date <= currentWeek.end);
  const weekCash = weekSales.filter(s=>s.paymentType==="taslimu").reduce((a,b)=>a+b.total,0);
  const weekMkopo = weekSales.filter(s=>s.paymentType==="mkopo").reduce((a,b)=>a+b.total,0);
  const weekExpensesTotal = weekExpenses.reduce((a,b)=>a+b.amount,0);

  function closeWeek(){
    if(alreadyClosedCurrent) return;
    if(!window.confirm("Una uhakika unataka kufunga stock na mauzo ya wiki "+currentWeek.start+" hadi "+currentWeek.end+"? Baada ya kufunga, hakuna atakayeweza kuongeza mauzo, gharama au stock ya tarehe hizo.")) return;
    const rec = {
      id: genId(), start: currentWeek.start, end: currentWeek.end,
      totalSales: weekCash+weekMkopo, totalCash: weekCash, totalMkopo: weekMkopo,
      totalExpenses: weekExpensesTotal,
      stockSnapshot: (rawStock||[]).map(it => ({ name: it.name, unit: it.unit, stock: it.stock||0 })),
      closedBy: session.sellerName, closedAt: nowDisplay(),
    };
    setWeeklyClosings([rec, ...(weeklyClosings||[])]);
  }

  const sortedClosings = [...(weeklyClosings||[])].sort((a,b)=>(b.start||"").localeCompare(a.start||""));

  return (
    <div>
      <h2 className="page-title">Ukaguzi wa Mahesabu</h2>

      <div className="card">
        <div className="row-actions" style={{marginBottom:6}}>
          {Object.keys(periodLabels).map(k => (
            <button key={k} className={"mini-btn"+(period===k?" danger":"")} onClick={()=>setPeriod(k)}>{periodLabels[k]}</button>
          ))}
          <button className="mini-btn" style={{marginLeft:"auto"}} onClick={()=>setUnlocked(false)}>Funga Ukaguzi</button>
        </div>
      </div>

      <h3 style={{color:"var(--wood-800)", fontSize:14, margin:"0 0 10px"}}>Kipindi: {periodLabels[period]}</h3>
      <div className="summary-row">
        <div className="summary-box">
          <div className="label">Mauzo ya Jumla (Taslimu + Mkopo)</div>
          <div className="value">{fmt(mauzoJumla)}</div>
        </div>
        <div className="summary-box">
          <div className="label">Mauzo ya Taslimu</div>
          <div className="value">{fmt(taslimuTotal)}</div>
        </div>
        <div className="summary-box">
          <div className="label">Mauzo ya Mkopo (Madeni ya Wateja)</div>
          <div className="value" style={{color:"var(--danger)"}}>{fmt(mkopoTotal)}</div>
        </div>
        <div className="summary-box">
          <div className="label">Gharama za Uendeshaji</div>
          <div className="value">{fmt(periodExpensesTotal)}</div>
        </div>
        <div className="summary-box">
          <div className="label">Pesa Taslimu Inayotarajiwa (Kipindi Hiki)</div>
          <div className="value" style={{color:"var(--wood-900)"}}>{fmt(pesaIliyopo)}</div>
        </div>
      </div>

      <div className="card">
        <h3>Mauzo kwa Kila Mfanyakazi ({periodLabels[period]})</h3>
        {sellerRows.length === 0 ? (
          <div className="empty">Hakuna mauzo kwenye kipindi hiki.</div>
        ) : (
          <div className="table-wrap">
            <table>
              <thead><tr><th>Mfanyakazi</th><th>Oda</th><th>Taslimu</th><th>Mkopo</th><th>Jumla</th></tr></thead>
              <tbody>
                {sellerRows.map(r => (
                  <tr key={r.name}>
                    <td>{r.name}</td><td>{r.count}</td><td>{fmt(r.cash)}</td><td>{fmt(r.mkopo)}</td>
                    <td style={{fontWeight:700}}>{fmt(r.total)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      <div className="card">
        <h3>Gharama kwa Kila Aliyeidhinisha/Kutumia ({periodLabels[period]})</h3>
        {expenseRows.length === 0 ? (
          <div className="empty">Hakuna gharama kwenye kipindi hiki.</div>
        ) : (
          <div className="table-wrap">
            <table>
              <thead><tr><th>Aliyeidhinisha/Alitumia</th><th>Idadi</th><th>Jumla ya Kiasi</th></tr></thead>
              <tbody>
                {expenseRows.map(r => (
                  <tr key={r.name}>
                    <td>{r.name}</td><td>{r.count}</td>
                    <td style={{fontWeight:700}}>{fmt(r.total)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      <div className="card">
        <h3>Menu Inayonunuliwa Sana ({periodLabels[period]})</h3>
        {bestSellerRows.length === 0 ? (
          <div className="empty">Hakuna mauzo kwenye kipindi hiki.</div>
        ) : (
          <div className="table-wrap">
            <table>
              <thead><tr><th>#</th><th>Kipengele</th><th>Aina</th><th>Idadi Iliyouzwa</th><th>Mapato</th></tr></thead>
              <tbody>
                {bestSellerRows.map((r,i) => (
                  <tr key={r.name}>
                    <td>{i+1}</td>
                    <td>{r.name} <span className={"category-badge "+r.category}>{categoryLabel(r.category)}</span></td>
                    <td>{categoryLabel(r.category)}</td>
                    <td style={{fontWeight:700}}>{fmt(r.qty)}</td>
                    <td>{fmt(r.revenue)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      <h3 style={{color:"var(--wood-800)", fontSize:14, margin:"0 0 10px"}}>Stock ya Malighafi (Hali ya Sasa)</h3>
      {lowStockItems.length > 0 && (
        <div className="note-box" style={{marginBottom:14, borderColor:"var(--danger)", color:"var(--danger)"}}>
          Malighafi zinazokaribia kuisha: {lowStockItems.map(it=>it.name).join(", ")}.
        </div>
      )}
      <div className="table-wrap card">
        <table>
          <thead><tr><th>Malighafi</th><th>Kipimo</th><th>Stock Iliyopo</th></tr></thead>
          <tbody>
            {(rawStock||[]).map(it => (
              <tr key={it.id}>
                <td>{it.name}</td><td>{unitLabel(it.unit)}</td>
                <td className={ (it.stock||0) <= LOW_STOCK_THRESHOLD ? "stock-low" : "stock-ok" }>{fmt(it.stock||0)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="card">
        <h3>Kufunga Stock na Mauzo ya Wiki</h3>
        <div className="note-box" style={{marginBottom:14}}>
          Wiki ya sasa: {currentWeek.start} hadi {currentWeek.end}. Ukifunga, hakuna atakayeweza kuongeza mauzo, gharama au stock ya tarehe zilizo ndani ya wiki hii.
        </div>
        <div className="summary-row">
          <div className="summary-box">
            <div className="label">Mauzo ya Wiki Hii (Taslimu+Mkopo)</div>
            <div className="value">{fmt(weekCash+weekMkopo)}</div>
          </div>
          <div className="summary-box">
            <div className="label">Gharama za Wiki Hii</div>
            <div className="value">{fmt(weekExpensesTotal)}</div>
          </div>
        </div>
        {alreadyClosedCurrent ? (
          <div className="note-box" style={{borderColor:"var(--ok)", color:"var(--ok)"}}>
            Wiki hii tayari imefungwa na {alreadyClosedCurrent.closedBy} tarehe {alreadyClosedCurrent.closedAt}.
          </div>
        ) : (
          <button className="btn-primary" onClick={closeWeek}>Funga Wiki Hii</button>
        )}

        {sortedClosings.length > 0 && (
          <div className="table-wrap" style={{marginTop:16}}>
            <table>
              <thead><tr><th>Wiki (Tarehe)</th><th>Mauzo Jumla</th><th>Gharama</th><th>Aliyefunga</th><th>Tarehe ya Kufunga</th></tr></thead>
              <tbody>
                {sortedClosings.map(w => (
                  <tr key={w.id}>
                    <td>{w.start} - {w.end}</td>
                    <td>{fmt(w.totalSales)}</td>
                    <td>{fmt(w.totalExpenses)}</td>
                    <td>{w.closedBy}</td>
                    <td>{w.closedAt}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      <div className="note-box">
        Pesa Taslimu Inayotarajiwa = Mauzo ya Taslimu &minus; Gharama za Uendeshaji, kwa kipindi kilichochaguliwa.
        Kiasi hiki ni makadirio; hakijumuishi fedha zilizowekwa benki au kutolewa nje ya mfumo huu.
      </div>
    </div>
  );
}

/* ---------- MFUMO (Owner-only: Recycle Bin & Full Data Wipe) ---------- */
function MfumoPage({ trash, setTrash, wipeAllData, restoreMap }){
  const [confirmText, setConfirmText] = useState("");

  function restoreItem(entry){
    const target = restoreMap[entry.type];
    if(!target){ window.alert("Aina hii ya taarifa haiwezi kurejeshwa moja kwa moja."); return; }
    target.setList([entry.data, ...(target.list||[])]);
    setTrash((trash||[]).filter(t=>t.id!==entry.id));
  }

  function purgeItem(id){
    if(!window.confirm("Una uhakika unataka kufuta kabisa taarifa hii kwenye Pipa la Taka? Haitaweza kurejeshwa tena.")) return;
    setTrash((trash||[]).filter(t=>t.id!==id));
  }

  function purgeAll(){
    if(!(trash||[]).length) return;
    if(!window.confirm("Una uhakika unataka kufuta kabisa taarifa ZOTE zilizoko kwenye Pipa la Taka? Haziwezi kurejeshwa tena.")) return;
    setTrash([]);
  }

  function doWipe(){
    if(confirmText.trim().toUpperCase() !== "FUTA"){
      window.alert('Andika neno "FUTA" kwenye kisanduku ili kuthibitisha.');
      return;
    }
    if(!window.confirm("HII NI HATUA YA MWISHO: taarifa ZOTE za mfumo (mauzo, gharama, stock, wafanyakazi, wateja, kila kitu) zitafutwa kabisa na mfumo utabaki tupu kama mpya. Una uhakika kabisa?")) return;
    wipeAllData();
  }

  const sortedTrash = [...(trash||[])].sort((a,b)=>(b.deletedAt||"").localeCompare(a.deletedAt||""));

  return (
    <div>
      <h2 className="page-title">Mfumo (Mmiliki Pekee)</h2>

      <div className="card">
        <h3>Pipa la Taka (Recycle Bin)</h3>
        <div className="note-box" style={{marginBottom:14}}>
          Taarifa zote zinazofutwa na wafanyakazi (au Mmiliki) huhifadhiwa hapa kwanza badala ya kupotea kabisa.
          Hii inasaidia kurejea taarifa endapo kuna wizi au udanganyifu unaofichwa kwa kufuta taarifa.
        </div>
        {sortedTrash.length === 0 ? (
          <div className="empty">Pipa la taka liko tupu.</div>
        ) : (
          <React.Fragment>
            <div className="row-actions" style={{marginBottom:14}}>
              <button className="mini-btn danger" onClick={purgeAll}>Futa Kabisa Vyote Kwenye Pipa</button>
            </div>
            <div className="table-wrap">
              <table>
                <thead><tr><th>Aina</th><th>Maelezo</th><th>Aliyefuta</th><th>Tarehe ya Kufuta</th><th>Vitendo</th></tr></thead>
                <tbody>
                  {sortedTrash.map(t => (
                    <tr key={t.id}>
                      <td>{roleLabelForTrash(t.type)}</td>
                      <td>{t.label}</td>
                      <td>{t.deletedBy}</td>
                      <td>{t.deletedAt}</td>
                      <td>
                        <div className="row-actions">
                          <button className="mini-btn" onClick={()=>restoreItem(t)}>Rejesha</button>
                          <button className="mini-btn danger" onClick={()=>purgeItem(t.id)}>Futa Kabisa</button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </React.Fragment>
        )}
      </div>

      <div className="card" style={{borderColor:"var(--danger)"}}>
        <h3 style={{color:"var(--danger)"}}>Futa Taarifa Zote (Weka Upya Mfumo)</h3>
        <div className="note-box" style={{marginBottom:14, borderColor:"var(--danger)", color:"var(--danger)"}}>
          Hatua hii itafuta KILA KITU kwenye mfumo huu (mauzo, gharama, stock, menu, wafanyakazi, wateja, historia yote) na mfumo utabaki bila data yoyote, kama mfumo mpya. Hatua hii HAIWEZI kutenguliwa. Fanya hivi kwa uangalifu mkubwa.
        </div>
        <div className="field" style={{maxWidth:300}}>
          <label>Andika neno "FUTA" kuthibitisha</label>
          <input value={confirmText} onChange={e=>setConfirmText(e.target.value)} placeholder="FUTA" />
        </div>
        <button className="btn-primary" style={{background:"var(--danger)", marginTop:10}} onClick={doWipe}>
          Futa Taarifa Zote Kabisa
        </button>
      </div>
    </div>
  );
}
function roleLabelForTrash(type){
  const map = { gharama:"Gharama", customerOrder:"Oda ya Mteja", distributor:"Msambazaji",
    dutyLog:"Jukumu la Siku", seller:"Mfanyakazi", menuItem:"Kipengele cha Menu", rawStockItem:"Malighafi" };
  return map[type] || type;
}
